name: Queue report reminders

on:
  schedule:
    # 08:00 and 20:00 Asia/Ho_Chi_Minh (UTC+7, no daylight saving time).
    - cron: "0 1,13 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bana-smartlink-reminders
  cancel-in-progress: false

jobs:
  reminders:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --requirement requirements.txt
      - name: Queue in-app notifications
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/reminder_cron.py
