name: Queue report reminders

on:
  schedule:
    # 08:00 and 20:00 Asia/Ho_Chi_Minh (UTC+7, no daylight saving time).
    - cron: "0 1,13 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bana-smartlink-reminders
  cancel-in-progress: false

jobs:
  reminders:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: staging
    env:
      REMINDER_JOB_ENABLED: ${{ vars.REMINDER_JOB_ENABLED }}
    steps:
      - name: Explain disabled release-candidate job
        if: env.REMINDER_JOB_ENABLED != 'true'
        run: >-
          echo "Reminder delivery is intentionally disabled for this release candidate.
          Set the staging variable REMINDER_JOB_ENABLED=true only after DATABASE_URL,
          UAT, and delivery monitoring are ready."
      - uses: actions/checkout@v4
        if: env.REMINDER_JOB_ENABLED == 'true'
      - uses: actions/setup-python@v5
        if: env.REMINDER_JOB_ENABLED == 'true'
        with:
          python-version: "3.12"
          cache: pip
      - if: env.REMINDER_JOB_ENABLED == 'true'
        run: python -m pip install --requirement requirements-prod.txt
      - name: Queue in-app notifications
        if: env.REMINDER_JOB_ENABLED == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/reminder_cron.py
