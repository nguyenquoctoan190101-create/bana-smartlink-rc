services:
  - type: web
    name: bana-smartlink-rc-toan-2026
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health/live
    autoDeployTrigger: commit
    envVars:
      - key: ENVIRONMENT
        value: staging
      - key: ALLOWED_ORIGINS
        value: https://bana-smartlink-rc-toan-2026.onrender.com
      - key: BANA_COMMUNE_ID
        value: ba_na
      - key: VITE_API_BASE_URL
        value: ""
      # Render terminates TLS and is the only public path to the container.
      # Local/container runs retain Dockerfile's loopback-only default.
      - key: FORWARDED_ALLOW_IPS
        value: "*"
      - key: FEATURE_CASES
        value: "true"
      - key: FEATURE_VOICE
        value: "true"
      # OCR remains non-persistent and sends only the locally detected table
      # crop. It becomes available only when GEMINI_API_KEY is also present.
      - key: FEATURE_EXTERNAL_OCR
        value: "true"
      - key: FEATURE_IOT_PILOT
        value: "false"
      - key: FEATURE_TOURISM_PILOT
        value: "false"
      - key: SUPABASE_JWT_AUDIENCE
        value: authenticated
      # Privileged users are gated in the frontend and every authenticated API
      # request is checked for the verified Supabase aal2 claim.
      - key: MFA_REQUIRED_ROLES
        value: admin_xa,lanh_dao
      # Configure INTERNAL_ALLOWED_IP_CIDRS in the Render Dashboard only after
      # the authority supplies approved office/VPN CIDRs. Keeping it unset
      # avoids locking out mobile staff and preserves the citizen portal.
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
