services:
  - type: web
    name: bana-smartlink-rc-toan-2026
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health/live
    autoDeployTrigger: commit
    envVars:
      - key: ENVIRONMENT
        value: staging
      - key: ALLOWED_ORIGINS
        value: https://bana-smartlink-rc-toan-2026.onrender.com
      - key: BANA_COMMUNE_ID
        value: ba_na
      - key: VITE_API_BASE_URL
        value: ""
      # Render terminates TLS and is the only public path to the container.
      # Local/container runs retain Dockerfile's loopback-only default.
      - key: FORWARDED_ALLOW_IPS
        value: "*"
      - key: FEATURE_CASES
        value: "true"
      - key: FEATURE_VOICE
        value: "true"
      # OCR remains non-persistent and sends only the locally detected table
      # crop. It becomes available only when GEMINI_API_KEY is also present.
      - key: FEATURE_EXTERNAL_OCR
        value: "true"
      # Keep OCR independent from future chatbot model changes.
      - key: GEMINI_OCR_MODEL
        value: gemini-3.5-flash-lite
      # Decision support is hybrid: deterministic metrics remain authoritative;
      # AI only adds grounded options/risks and always requires human review.
      # Auto prefers OpenAI when its secret exists, otherwise the already
      # configured Gemini provider, then fails safely to deterministic output.
      - key: FEATURE_DECISION_AI
        value: "true"
      - key: DECISION_AI_PROVIDER
        value: auto
      - key: OPENAI_API_URL
        value: https://api.openai.com/v1
      - key: OPENAI_DECISION_MODEL
        value: gpt-5.6-sol
      - key: FEATURE_IOT_PILOT
        value: "false"
      - key: FEATURE_TOURISM_PILOT
        value: "false"
      - key: SUPABASE_JWT_AUDIENCE
        value: authenticated
      # Privileged users are gated in the frontend and every authenticated API
      # request is checked for the verified Supabase aal2 claim.
      - key: MFA_REQUIRED_ROLES
        value: admin_xa,lanh_dao
      # Temporary DUETech judging window: keep TOTP code and enrolled factors
      # intact, but do not require the second step for shared demo accounts.
      # Restore production behavior by changing this value back to "true".
      - key: MFA_ENFORCEMENT_ENABLED
        value: "false"
      # Configure INTERNAL_ALLOWED_IP_CIDRS in the Render Dashboard only after
      # the authority supplies approved office/VPN CIDRs. Keeping it unset
      # avoids locking out mobile staff and preserves the citizen portal.
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
