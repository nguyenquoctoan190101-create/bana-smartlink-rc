services:
  - type: web
    name: bana-smartlink-rc-toan-2026
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health/live
    autoDeployTrigger: commit
    envVars:
      - key: ENVIRONMENT
        value: staging
      - key: ALLOWED_ORIGINS
        value: https://bana-smartlink-rc-toan-2026.onrender.com
      - key: BANA_COMMUNE_ID
        value: ba_na
      - key: VITE_API_BASE_URL
        value: ""
      # Render terminates TLS and is the only public path to the container.
      # Local/container runs retain Dockerfile's loopback-only default.
      - key: FORWARDED_ALLOW_IPS
        value: "*"
      - key: FEATURE_CASES
        value: "true"
      - key: FEATURE_VOICE
        value: "false"
      - key: FEATURE_IOT_PILOT
        value: "false"
      - key: FEATURE_TOURISM_PILOT
        value: "false"
      - key: SUPABASE_JWT_AUDIENCE
        value: authenticated
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
